name: Deploy from ZIP

# فقط وقتی فایلی به اسم upload.zip تو ریشه‌ی ریپو تغییر/اضافه بشه اجرا می‌شه
on:
  push:
    paths:
      - "upload.zip"

permissions:
  contents: write

jobs:
  replace-repo-with-zip:
    runs-on: ubuntu-latest
    steps:
      - name: چک‌اوت ریپو
        uses: actions/checkout@v4

      - name: باز کردن زیپ تو یه پوشه‌ی موقت
        run: |
          rm -rf _zip_extract
          mkdir _zip_extract
          unzip -q upload.zip -d _zip_extract

      - name: اگه زیپ یه پوشه‌ی تک واحد داشت، بازش کن (flatten)
        run: |
          cd _zip_extract
          entries=(*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* .
            mv "${entries[0]}"/.[!.]* . 2>/dev/null || true
            rmdir "${entries[0]}"
          fi

      - name: پاک‌کردنِ کل ریپو (به‌جز .git و .github)
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_zip_extract" \
            -exec rm -rf {} +

      - name: کپی‌کردنِ محتوای زیپ به ریشه‌ی ریپو
        run: |
          cp -r _zip_extract/. .
          rm -rf _zip_extract
          rm -f upload.zip

      - name: کامیت و پوش تغییرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست"
          else
            git commit -m "دیپلوی خودکار از upload.zip"
            git push
          fi
